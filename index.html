<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta property="og:site_name" content="فكر واستمتع">

<meta name="twitter:title" content="فكر واستمتع">
<meta name="twitter:description" content="ألعاب ممتعة للأطفال: تركيب الصور وربط الأشكال. العب الآن مجاناً!">

<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fff7e6; --card:#ffffff; --ink:#26364a; --muted:#5b6e82; --line:#e6dcc3;
  --accent:#1f6e9e; --accent-ink:#ffffff; --good:#4a9a2a; --slot:#d9cfb5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13202d; --card:#1c2e40; --ink:#eef6fa; --muted:#9db6c6; --line:#2f4a5e;
    --accent:#54c0cc; --accent-ink:#10303a; --good:#8bd45a; --slot:#3a566b;
  }
}
:root[data-theme="dark"]{
  --bg:#13202d; --card:#1c2e40; --ink:#eef6fa; --muted:#9db6c6; --line:#2f4a5e;
  --accent:#54c0cc; --accent-ink:#10303a; --good:#8bd45a; --slot:#3a566b;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo Bhaijaan 2","Cairo","Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 16px 32px}
.screen[hidden]{display:none}
button{font-family:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.logo{text-align:center;margin:8px 0 22px}
.logo svg{width:120px;height:120px}
.logo h1{margin:6px 0 0;font-size:2.2rem;font-weight:800;color:var(--accent)}
.logo p{margin:2px 0 0;color:var(--muted)}
.menu{display:grid;grid-template-columns:max-content;justify-content:center;gap:14px}
.menu .gb{flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 28px;white-space:nowrap}
.menu button:last-child:nth-child(odd){grid-column:1/-1}
.gb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:22px;border:3px solid var(--line);background:var(--card);color:var(--ink);font-size:1.05rem;font-weight:800;cursor:pointer}
.gb span{font-size:2.4rem;line-height:1}
.gb:active{transform:scale(.97)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h2{margin:0;font-size:1.25rem;font-weight:800}
/* hidden on screen, still read by screen readers (the puzzle header shows only the level box and sound) */
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.back{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
.hint{margin:0 0 12px;color:var(--muted);font-size:.95rem;text-align:center}
.btn{font-weight:700;padding:10px 18px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:1rem}
.row{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}
.msg{min-height:1.6em;text-align:center;font-weight:800;color:var(--good);margin:8px 0 0}
#board{direction:ltr;position:relative;width:min(100%,320px);aspect-ratio:1;margin:0 auto 14px;touch-action:none;background:var(--slot);border-radius:10px;overflow:hidden}
.tile{position:absolute;margin:0;padding:0;border:0;border-radius:0;background-repeat:no-repeat;cursor:grab;touch-action:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75);transition:left .15s,top .15s}
.tile:active{cursor:grabbing}
.tile.no{animation:sh .35s}
.tile.sel{border-color:var(--accent);transform:scale(.94)}
.shapes{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:14px}
.shapes button{width:calc((100% - 30px)/4);aspect-ratio:1;border-radius:16px;border:3px solid var(--line);background:transparent;padding:6px;cursor:pointer}
.shapes button.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.shapes button.done{visibility:hidden}
.shapes svg{width:100%;height:100%}
.slot .o{fill:var(--slot);stroke:var(--muted);stroke-width:3;stroke-dasharray:6 5}
.slot.ok .o{stroke:none;stroke-dasharray:none}
.slot.no{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.slot.no{animation:none}}
.em{font-size:2.2rem;line-height:1;display:flex;align-items:center;justify-content:center;height:100%}
/* picture slots look like the shape slots: light fill (--slot) with a --muted outline.
   The outline is drawn by drop-shadows on the wrapper, because a filter on the masked element itself would be cut off by its mask. */
.slot .psw{display:block;width:100%;height:100%;
  filter:drop-shadow(2px 0 0 var(--muted)) drop-shadow(-2px 0 0 var(--muted)) drop-shadow(0 2px 0 var(--muted)) drop-shadow(0 -2px 0 var(--muted))}
.slot .ps{display:block;width:100%;height:100%;background:var(--slot);
  -webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.slot .sil{display:none}
.slot.ok .psw{display:none}
.slot.ok .sil{display:block}
#hintimg{width:min(100%,320px);aspect-ratio:1;margin:0 auto 14px;border-radius:8px}
.im{width:100%;height:100%;object-fit:contain;display:block}
.lvl{text-align:center;font-weight:800;color:var(--accent);margin:0 0 10px}
.tile.fix{border-color:color-mix(in srgb,var(--good) 70%,transparent);cursor:default}
.tile:disabled{opacity:1}

/* ---- celebration */
.winov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 40%,rgba(31,110,158,.92),rgba(10,22,34,.96));overflow:hidden}
.winov[hidden]{display:none}
.winbox{position:relative;z-index:2;width:min(92vw,420px);text-align:center}
.wintxt{margin:0 0 14px;font-size:1.5rem;font-weight:800;color:#ffd23f;text-shadow:0 2px 12px rgba(255,210,63,.6);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.winimg{position:relative;width:100%;aspect-ratio:1;margin:0 auto 18px;border-radius:18px;overflow:hidden;border:5px solid #ffd23f;background:#fff;cursor:pointer;animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,glow 1s ease-in-out .7s 6 alternate}
.winimg img{width:100%;height:100%;object-fit:contain;display:block;animation:flash 1s ease-in-out .7s 4}
.shine{position:absolute;inset:-20%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);transform:translateX(-120%);animation:sweep 1.6s ease-in-out .7s 3;pointer-events:none}
.winov .row{gap:14px}
.ib{width:58px;height:58px;padding:0;border-radius:50%;font-size:1.6rem;line-height:1;display:flex;align-items:center;justify-content:center}
.sp{position:absolute;z-index:1;pointer-events:none;line-height:1;animation:tw 1.4s ease-in-out 4}
.cf{position:absolute;z-index:1;top:-6%;width:9px;height:15px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes glow{from{box-shadow:0 0 10px 1px rgba(255,210,63,.3)}to{box-shadow:0 0 24px 5px rgba(255,226,120,.5)}}
@keyframes flash{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.1) saturate(1.1)}}
@keyframes sweep{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(25deg)}}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){
  .winimg,.wintxt{animation:none}
  .winimg{box-shadow:0 0 20px 4px rgba(255,226,120,.45)}
  .winimg img,.shine,.sp,.cf{animation:none}
  .shine,.cf{display:none}
  .sp{opacity:.85}
}
/* ---- shape drag */
#pieces button{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;position:relative}
#pieces button img{pointer-events:none;-webkit-user-drag:none}
#pieces button.drag{z-index:10;cursor:grabbing;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.shapes button.slot.over{border-color:var(--accent)}

/* ---- glass buttons */
:root{--g-bg:rgba(255,255,255,.42);--g-bd:rgba(255,255,255,.85);--g-tint:rgba(31,110,158,.18);--g-sh:rgba(31,80,120,.18);--g-hi:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g-bg:rgba(255,255,255,.10);--g-bd:rgba(255,255,255,.28);--g-tint:rgba(84,192,204,.25);--g-sh:rgba(0,0,0,.4);--g-hi:rgba(255,255,255,.35)}}
:root[data-theme="dark"]{--g-bg:rgba(255,255,255,.10);--g-bd:rgba(255,255,255,.28);--g-tint:rgba(84,192,204,.25);--g-sh:rgba(0,0,0,.4);--g-hi:rgba(255,255,255,.35)}
body{background-color:var(--bg);background-image:radial-gradient(circle at 12% 8%,rgba(84,192,204,.30),transparent 42%),radial-gradient(circle at 92% 30%,rgba(240,132,84,.24),transparent 40%),radial-gradient(circle at 20% 92%,rgba(252,201,70,.26),transparent 42%);background-attachment:fixed}
.gb,.back,.btn{position:relative;overflow:hidden;isolation:isolate;color:var(--ink);
  background:linear-gradient(145deg,var(--g-hi),transparent 55%),var(--g-bg);
  border:1.5px solid var(--g-bd);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:0 6px 18px var(--g-sh),inset 0 1px 0 var(--g-hi);
  transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}
.btn{background:linear-gradient(145deg,var(--g-hi),transparent 55%),var(--g-tint)}
.gb::after,.back::after,.btn::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);
  transform:translateX(-130%);transition:transform .6s ease}
@media (hover:hover){
  .gb:hover,.back:hover,.btn:hover{transform:translateY(-3px) scale(1.03);border-color:var(--accent);
    box-shadow:0 12px 26px var(--g-sh),0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 0 var(--g-hi)}
  .gb:hover::after,.back:hover::after,.btn:hover::after{transform:translateX(130%)}
}
.gb:active,.back:active,.btn:active{transform:translateY(0) scale(.96);box-shadow:0 3px 10px var(--g-sh),inset 0 1px 0 var(--g-hi)}
.btn.ib{font-size:1.6rem}
/* no blur over the moving sparkles: it would be recomputed every frame */
.winov .btn{-webkit-backdrop-filter:none;backdrop-filter:none;color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.4),transparent 55%),rgba(255,255,255,.14);border-color:rgba(255,255,255,.55)}
@media (prefers-reduced-motion:reduce){
  .gb,.back,.btn{transition:none}
  .gb::after,.back::after,.btn::after{display:none}
  .gb:hover,.back:hover,.btn:hover,.gb:active,.back:active,.btn:active{transform:none}
}

/* ---- logo + splash */
.lg{display:block;width:min(70vw,250px);aspect-ratio:1;object-fit:contain;margin:0 auto;background:none;filter:drop-shadow(0 8px 16px var(--g-sh,rgba(31,80,120,.18)))}
.logo .lg{margin-bottom:8px}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
  background-color:var(--bg);background-image:radial-gradient(circle at 12% 8%,rgba(84,192,204,.30),transparent 42%),radial-gradient(circle at 92% 30%,rgba(240,132,84,.24),transparent 40%),radial-gradient(circle at 20% 92%,rgba(252,201,70,.26),transparent 42%);
  transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .lg{width:min(72vw,300px)}
#splash p{margin:0;color:var(--muted);font-weight:700}
.ldbar{direction:rtl;position:relative;width:min(70vw,280px);height:14px;border-radius:99px;overflow:hidden;
  background:var(--g-bg);border:1.5px solid var(--g-bd);box-shadow:inset 0 1px 3px var(--g-sh)}
.ldbar i{position:absolute;top:0;bottom:0;right:0;width:100%;border-radius:99px;transform:scaleX(0);transform-origin:right center;
  background:linear-gradient(270deg,#f08454,#fcc946,#54c0cc);animation:ld 3s linear forwards}
@keyframes ld{to{transform:scaleX(1)}}
/* developer logo at the bottom of the splash (same as تلويناتي); white version in dark mode */
#splash .sp-dev{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));height:56px;width:auto;transform:translateX(-50%);opacity:0;animation:devIn .6s ease-out .5s forwards}
@keyframes devIn{to{opacity:1}}
#splash .dk-yes{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #splash .dk-yes{display:block}:root:not([data-theme="light"]) #splash .dk-no{display:none}}
:root[data-theme="dark"] #splash .dk-yes{display:block}
:root[data-theme="dark"] #splash .dk-no{display:none}
@media (max-height:520px){#splash{padding-bottom:calc(66px + env(safe-area-inset-bottom))}#splash .sp-dev{height:42px;bottom:calc(12px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){#splash .sp-dev{animation:none;opacity:1}}

/* ---- cute icons */
.ib svg{width:34px;height:34px;display:block;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.gb span svg{width:2.9rem;height:2.9rem;display:block;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.back{display:inline-flex;align-items:center;gap:6px}
.hs{width:20px;height:20px}
@media (hover:hover){.ib:hover svg{transform:scale(1.18) rotate(-8deg)}.gb:hover span svg{transform:scale(1.12) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.ib svg,.gb span svg{transition:none}.ib:hover svg,.gb:hover span svg{transform:none}}

/* ---- game header: title right, level box left */
.top{justify-content:space-between}
/* sound on/off: top-left of each game, next to the level box */
.topl{display:flex;align-items:center;gap:10px}
.ib.snd{width:48px;height:48px;flex:none}
.ib.snd svg{width:30px;height:30px}
@media (max-width:400px){.lvbox{width:150px}}
.snd .off,.snd.muted .on{display:none}
.snd.muted .off{display:inline}
.lvbox{display:flex;align-items:center;gap:9px;width:200px;padding:10px 14px;border-radius:16px;
  background:linear-gradient(145deg,var(--g-hi),transparent 55%),var(--g-bg);border:1.5px solid var(--g-bd);
  -webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);
  box-shadow:0 6px 18px var(--g-sh),inset 0 1px 0 var(--g-hi)}
.lvbox span{font-weight:800;font-size:.95rem;color:var(--accent);line-height:1.1;white-space:nowrap}
.lvbox .pb{flex:1;min-width:0}
.lvbox .lvn{min-width:1.5em;text-align:center}
.pb{direction:rtl;position:relative;height:9px;border-radius:99px;overflow:hidden;background:rgba(0,0,0,.12);box-shadow:inset 0 1px 2px var(--g-sh)}
.pb i{position:absolute;top:0;bottom:0;right:0;width:100%;border-radius:99px;transform:scaleX(0);transform-origin:right center;
  background:linear-gradient(270deg,#f08454,#fcc946,#54c0cc);transition:transform .35s ease}
@media (prefers-reduced-motion:reduce){.pb i{transition:none}}
/* back button, bottom-left under the picture */
.row.acts{position:relative}
.bkb{position:absolute;left:0;top:50%;margin-top:-29px}
.rsb{position:absolute;right:0;top:50%;margin-top:-29px}
.bk{direction:ltr;display:flex;justify-content:flex-start;margin:0 0 12px}

/* ---- logo effect: float + shine */
/* battery: the float and shine run 3 times, then the logo rests (an endless animation keeps the screen redrawing) */
.lgw{--logo:url("assets/logo-99a0d23e.webp");position:relative;width:min(70vw,250px);margin:0 auto;animation:flt 4s ease-in-out 3}
#splash .lgw{width:min(72vw,300px)}
.lgw .lg{width:100%}
.logo .lgw{margin-bottom:8px}
.lgw::after{content:"";position:absolute;inset:0;pointer-events:none;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
  background:linear-gradient(110deg,transparent 42%,rgba(255,214,102,.75) 50%,transparent 58%);
  background-size:260% 100%;background-position:160% 0;animation:shn 4s ease-in-out 3}
@keyframes shn{0%,50%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.lgw,.lgw::after{animation:none}}

/* ---- 3. sort the pictures */
.cstage{display:flex;align-items:center;justify-content:center;height:190px;margin-bottom:14px}
.cpic{width:160px;height:160px;padding:8px;border-radius:22px;border:3px solid var(--line);background:var(--card);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;position:relative;box-shadow:0 8px 20px var(--g-sh)}
.cpic img{pointer-events:none;-webkit-user-drag:none}
.cpic.drag{z-index:10;cursor:grabbing;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.cpic.sel{border-color:var(--accent)}
.cboxes{display:grid;grid-template-columns:repeat(var(--k,2),1fr);gap:10px;margin-bottom:14px}
.cbox{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:12px 4px;border-radius:18px;border:3px dashed var(--line);background:transparent;color:var(--ink);font-weight:800;font-size:.95rem;cursor:pointer}
.cbox svg{width:48px;height:48px;display:block}
.cbox span{white-space:nowrap}
.cbox.over{border-color:var(--accent);border-style:solid;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.cbox.no{animation:sh .35s}
.cbox.hit{animation:cpop .5s}
@keyframes cpop{40%{transform:scale(1.1);border-color:var(--good)}}
@media (prefers-reduced-motion:reduce){.cbox.no,.cbox.hit{animation:none}}
@media (max-width:360px){.cbox svg{width:38px;height:38px}.cbox{font-size:.8rem}}
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="lgw"><img class="lg" id="splogo" alt="شعار فكّر واستمتع" src="assets/logo-99a0d23e.webp"></div>
  <div class="ldbar" role="progressbar" aria-label="جارٍ التحميل"><i></i></div>
  <p>جارٍ التحميل…</p>
  <img class="sp-dev dk-no" src="dev-logo.png" width="40" height="56" alt="وقار">
  <img class="sp-dev dk-yes" src="dev-logo-white.png" width="40" height="56" alt="وقار">
</div>
<main>
  <section class="screen" id="home">
    <div class="logo">
      <div class="lgw"><img class="lg" id="homelogo" alt="شعار فكّر واستمتع" src="assets/logo-99a0d23e.webp"></div>
      <h1 style="position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">فكر واستمتع</h1>
